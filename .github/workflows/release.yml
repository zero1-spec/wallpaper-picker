name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build installer and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if ((Test-Path $iscc) -or (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            Write-Host "Inno Setup 6 found."
          } else {
            Write-Host "Installing Inno Setup 6 via Chocolatey..."
            choco install innosetup -y
          }

      - name: Verify tag matches MyAppVersion
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $iss = Get-Content installer\WallpaperSetup.iss -Raw
          if ($iss -notmatch '#define MyAppVersion "([^"]+)"') { throw "MyAppVersion not found in installer\WallpaperSetup.iss" }
          $issVersion = $Matches[1]
          $tag = "${{ github.ref_name }}"
          $tagVersion = if ($tag -match '^v(.+)$') { $Matches[1] } else { $tag }
          Write-Host "tag=$tag tagVersion=$tagVersion MyAppVersion=$issVersion"
          if ($tagVersion -ne $issVersion) {
            throw "Tag '$tag' (version $tagVersion) does not match MyAppVersion $issVersion. Update installer\WallpaperSetup.iss and Walld.csproj before tagging."
          }

      - name: Build and package
        shell: pwsh
        run: |
          dotnet build WallpaperSuite.sln -c Release -warnaserror
          .\build\release.ps1

      - name: Verify release artifacts exist
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer\Output\WallpaperSetup-*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $sha = Get-ChildItem installer\Output\WallpaperSetup-*.exe.sha256 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Installer not found: installer\Output\WallpaperSetup-*.exe" }
          if (-not $sha) { throw "Checksum not found: installer\Output\WallpaperSetup-*.exe.sha256" }
          Write-Host "Installer: $($exe.FullName)"
          Write-Host "Checksum:  $($sha.FullName)"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = (Get-ChildItem installer\Output\WallpaperSetup-*.exe | Select-Object -First 1).FullName
          $sha = (Get-ChildItem installer\Output\WallpaperSetup-*.exe.sha256 | Select-Object -First 1).FullName
          gh release create "${{ github.ref_name }}" $exe $sha --generate-notes --title "${{ github.ref_name }}"